name: Group Project CI/CD SFTP Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # STEP 1: Continuous Integration (Test code before touching the server)
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Verify HTML Files Exist
        run: |
          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html found."
          else
            echo "ERROR: index.html is missing!" && exit 1
          fi

  # STEP 2: Continuous Deployment (Automating WinSCP transfer)
  deploy-to-server:
    runs-on: ubuntu-latest
    needs: validate-code # Ensures tests pass before uploading to production

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      # This replaces manual WinSCP drag-and-drop by uploading via SFTP
      - name: Transfer Files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }} # e.g., lsu-ccsea-porsh
          server: ${{ secrets.SFTP_HOST }} # 185.210.144.35
          port: 22 # Port 22
          password: ${{ secrets.SFTP_PASSWORD }} # Your group's site password
          local_path: "./" # Local folder root
          remote_path: "/home/lsu-source-test/htdocs/test.lsu-source.org/" # Match your exact Cloud Panel / WinSCP htdocs directory
          args: "-o ConnectTimeout=30"
